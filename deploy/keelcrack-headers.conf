# /etc/nginx/keelcrack-headers.conf — security headers for keelcrack.xyz. Installed by deploy/provision.sh.
# nginx's add_header is NOT inherited into a location that sets its own add_header, so this file is included at server
# level AND inside every location that adds Cache-Control. No CSP yet (pages carry an inline importmap / boot script).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header X-Frame-Options SAMEORIGIN always;
