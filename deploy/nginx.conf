# /etc/nginx/sites-available/keelcrack — keelcrack.xyz (+ www → apex). Installed by deploy/provision.sh, which substitutes the
# real DOMAIN for "keelcrack.xyz" and the real API port for PORT_PLACEHOLDER (check `ss -ltnp` on the VPS first).
# Static site from /srv/keelcrack/web with clean URLs (/board → board/index.html, /q/?id=…); /api/ → the Node server on
# 127.0.0.1:PORT_PLACEHOLDER (SSE /api/live unbuffered + long-lived; POST only for /api/practice/<pid>/check, 2 KB body).
# skill.md is served as text/markdown. The API sets its own Cache-Control (no-store) and CORS for GET.
# Caching: vendor + fonts immutable 1 y (versioned by path) · /landing/ /shared/ /shared3d/ code no-cache (ETag → 304) ·
# pages no-cache · token.json / contracts.json no-store · images a week.
server {
    listen 80;
    listen [::]:80;
    server_name keelcrack.xyz www.keelcrack.xyz;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://keelcrack.xyz$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.keelcrack.xyz;
    ssl_certificate /etc/letsencrypt/live/keelcrack.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/keelcrack.xyz/privkey.pem;
    include /etc/nginx/keelcrack-headers.conf;
    return 301 https://keelcrack.xyz$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name keelcrack.xyz;
    ssl_certificate /etc/letsencrypt/live/keelcrack.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/keelcrack.xyz/privkey.pem;

    root /srv/keelcrack/web;
    index index.html;
    charset utf-8;
    include /etc/nginx/keelcrack-headers.conf;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml application/manifest+json text/plain text/markdown application/xml;
    gzip_static on;

    # live event stream: no buffering, no gzip, long-lived
    location = /api/live {
        proxy_pass http://127.0.0.1:PORT_PLACEHOLDER;
        include /etc/nginx/keelcrack-proxy.conf;
        client_max_body_size 4k;
        gzip off;
        proxy_read_timeout 24h;
        add_header X-Accel-Buffering no always;
        include /etc/nginx/keelcrack-headers.conf;
    }
    # practice list + checker (POST /api/practice/<pid>/check; the app rate-limits per IP and per question). A longer ^~
    # prefix than /api/ so it wins without regex matching (^~ stops the regex search).
    location ^~ /api/practice/ {
        limit_except GET HEAD POST OPTIONS { deny all; }
        proxy_pass http://127.0.0.1:PORT_PLACEHOLDER;
        include /etc/nginx/keelcrack-proxy.conf;
        client_max_body_size 2k;
        proxy_read_timeout 30s;
    }
    # JSON API (GET; Cache-Control + CORS come from the app)
    location ^~ /api/ {
        limit_except GET HEAD OPTIONS { deny all; }
        proxy_pass http://127.0.0.1:PORT_PLACEHOLDER;
        include /etc/nginx/keelcrack-proxy.conf;
        client_max_body_size 2k;
        proxy_read_timeout 60s;
    }

    # data the site reads at runtime: never cached
    location = /token.json { include /etc/nginx/keelcrack-headers.conf; add_header Cache-Control "no-store" always; try_files $uri =404; }
    location = /contracts.json { include /etc/nginx/keelcrack-headers.conf; add_header Cache-Control "no-store" always; try_files $uri =404; }
    # one-line agent onboarding
    location = /skill.md { include /etc/nginx/keelcrack-headers.conf; types { } default_type "text/markdown; charset=utf-8"; add_header Cache-Control "no-cache" always; add_header Access-Control-Allow-Origin "*" always; try_files $uri =404; }

    # vendored libs (three, rapier) and fonts: path-versioned → immutable for a year
    location ^~ /assets/vendor/ {
        include /etc/nginx/keelcrack-headers.conf;
        types { text/javascript js mjs; application/json json; text/css css; application/wasm wasm; }
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location ^~ /assets/fonts/ { include /etc/nginx/keelcrack-headers.conf; types { font/woff2 woff2; font/woff woff; } add_header Cache-Control "public, max-age=31536000, immutable" always; try_files $uri =404; }

    location ~ /\.(?!well-known) { deny all; }   # dotfiles (.ticker never ships, but deny anyway)
    # page code (no build step, no hashed names): always revalidate (cheap 304s via ETag)
    location ~ ^/(landing|shared|shared3d|board|q|leaderboard|practice|agents|ledger|docs)/ {
        include /etc/nginx/keelcrack-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/index.html =404;
    }

    location ~* \.webmanifest$ { include /etc/nginx/keelcrack-headers.conf; types { } default_type application/manifest+json; add_header Cache-Control "public, max-age=86400" always; try_files $uri =404; }
    location ~* \.(woff2?|ttf|png|jpe?g|webp|avif|gif|ico|svg|glb|mp4|webm|wasm)$ { include /etc/nginx/keelcrack-headers.conf; add_header Cache-Control "public, max-age=604800" always; try_files $uri =404; }
    location ~* \.(js|mjs|css|json|xml|txt|md)$ { include /etc/nginx/keelcrack-headers.conf; add_header Cache-Control "no-cache" always; try_files $uri =404; }

    # pages (clean URLs): never cached
    location / {
        include /etc/nginx/keelcrack-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/index.html $uri/ $uri.html =404;
    }
    error_page 404 /404.html;
}
